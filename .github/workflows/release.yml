name: Release CI

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v0.6.0-beta.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft release from changelogs
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="${INPUT_TAG_NAME}"
          fi

          if [[ ! "${tag_name}" =~ ^v[0-9]+ ]]; then
            echo "::error::Release tag must start with v followed by a version, got '${tag_name}'."
            exit 1
          fi

          git fetch --force --tags
          if ! git rev-parse --verify --quiet "refs/tags/${tag_name}" >/dev/null; then
            echo "::error::Tag '${tag_name}' does not exist."
            exit 1
          fi

          git checkout --detach "refs/tags/${tag_name}"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md is required. Run release-it before pushing the release tag."
            exit 1
          fi
          if [[ ! -f CHANGELOG.zh-CN.md ]]; then
            echo "::error::CHANGELOG.zh-CN.md is required. Run release-it before pushing the release tag."
            exit 1
          fi

          version="${tag_name#v}"
          extract_changelog_section() {
            local file="$1"
            local output="$2"

            awk -v version="${version}" '
            function is_target_heading(line) {
              return line ~ "^##[[:space:]]+\\[?" version "\\]?"
            }

            /^##[[:space:]]+/ {
              if (capture) {
                exit
              }

              if (is_target_heading($0)) {
                capture = 1
                next
              }
            }

            capture {
              print
            }
            ' "${file}" | sed '/./,$!d' > "${output}"
          }

          extract_changelog_section CHANGELOG.md release-body-en.md
          extract_changelog_section CHANGELOG.zh-CN.md release-body-zh.md

          if [[ ! -s release-body-en.md ]]; then
            echo "::error::CHANGELOG.md does not contain a release section for ${version}."
            exit 1
          fi
          if [[ ! -s release-body-zh.md ]]; then
            echo "::error::CHANGELOG.zh-CN.md does not contain a release section for ${version}."
            exit 1
          fi

          {
            cat release-body-en.md
            printf '\n\n<hr>\n\n'
            cat release-body-zh.md
          } > release-body.md

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          title="${tag_name}"
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            if [[ "${prerelease}" == "true" ]]; then
              gh release edit "${tag_name}" --draft --prerelease --title "${title}" --notes-file release-body.md
            else
              gh release edit "${tag_name}" --draft --title "${title}" --notes-file release-body.md
            fi
          else
            if [[ "${prerelease}" == "true" ]]; then
              gh release create "${tag_name}" --draft --prerelease --title "${title}" --notes-file release-body.md --verify-tag
            else
              gh release create "${tag_name}" --draft --title "${title}" --notes-file release-body.md --verify-tag
            fi
          fi

          release_id="$(gh release view "${tag_name}" --json databaseId --jq .databaseId)"

          {
            echo "prerelease=${prerelease}"
            echo "release_id=${release_id}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

  build-app:
    name: Build ${{ matrix.label }}
    needs: release-metadata
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: ${{ matrix.os }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Extract changelog body
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ needs.release-metadata.outputs.tag_name }}"
          version="${tag_name#v}"

          extract_changelog_section() {
            local file="$1"
            local output="$2"

            awk -v version="${version}" '
            function is_target_heading(line) {
              return line ~ "^##[[:space:]]+\\[?" version "\\]?"
            }

            /^##[[:space:]]+/ {
              if (capture) {
                exit
              }

              if (is_target_heading($0)) {
                capture = 1
                next
              }
            }

            capture {
              print
            }
            ' "${file}" | sed '/./,$!d' > "${output}"
          }

          extract_changelog_section CHANGELOG.md release-body-en.md
          extract_changelog_section CHANGELOG.zh-CN.md release-body-zh.md

          if [[ ! -s release-body-en.md ]]; then
            echo "::error::CHANGELOG.md does not contain a release section for ${version}."
            exit 1
          fi
          if [[ ! -s release-body-zh.md ]]; then
            echo "::error::CHANGELOG.zh-CN.md does not contain a release section for ${version}."
            exit 1
          fi

          {
            cat release-body-en.md
            printf '\n\n<hr>\n\n'
            cat release-body-zh.md
          } > release-body.md

          delimiter="CHANGELOG_BODY_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delimiter}"
            cat release-body.md
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and upload app
        uses: tauri-apps/tauri-action@v1
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PLATFORM: ${{ matrix.os }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          includeUpdaterJson: false
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseId: ${{ needs.release-metadata.outputs.release_id }}
          retryAttempts: 3
          tagName: ${{ needs.release-metadata.outputs.tag_name }}

      - name: Prepare stable Windows installer assets
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ matrix.target }}"
          $installer = Get-Item "src-tauri/target/$target/release/bundle/nsis/EcoPaste_*-setup.exe"
          if (@($installer).Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $(@($installer).Count)."
          }

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item $installer.FullName "release-assets/EcoPaste_x64-setup.exe"
          Copy-Item "scripts/installFromGitHub.ps1" "release-assets/install-ecopaste.ps1"

          $hash = (Get-FileHash "release-assets/EcoPaste_x64-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EcoPaste_x64-setup.exe" | Set-Content "release-assets/EcoPaste_x64-setup.exe.sha256" -Encoding ascii

      - name: Upload stable Windows installer assets
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ needs.release-metadata.outputs.tag_name }}"
          $assets = Get-ChildItem release-assets -File
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading stable Windows release assets failed with exit code $LASTEXITCODE."
          }

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-metadata
      - build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build updater manifest from signed platform assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_ID: ${{ needs.release-metadata.outputs.release_id }}
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          rm -rf updater-signatures
          mkdir updater-signatures
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.sig" \
            --dir updater-signatures
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            > release-assets.json
          gh release view "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json body \
            --jq .body > release-notes.md

          asset_url() {
            local name="$1"
            local url
            url="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .browser_download_url' release-assets.json)"
            if [[ -z "${url}" ]]; then
              echo "::error::Release asset '${name}' is missing."
              exit 1
            fi
            printf '%s' "${url}"
          }

          asset_signature() {
            local name="$1"
            local signature_file="updater-signatures/${name}.sig"
            if [[ ! -s "${signature_file}" ]]; then
              echo "::error::Updater signature '${signature_file##*/}' is missing."
              exit 1
            fi
            tr -d '\r\n' < "${signature_file}"
          }

          win_x64="EcoPaste_${version}_x64-setup.exe"
          win_arm64="EcoPaste_${version}_arm64-setup.exe"
          mac_x64="EcoPaste_${version}_x64.app.tar.gz"
          mac_arm64="EcoPaste_${version}_aarch64.app.tar.gz"

          jq -n \
            --arg version "${version}" \
            --arg notes "$(cat release-notes.md)" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg win_x64_url "$(asset_url "${win_x64}")" \
            --arg win_x64_sig "$(asset_signature "${win_x64}")" \
            --arg win_arm64_url "$(asset_url "${win_arm64}")" \
            --arg win_arm64_sig "$(asset_signature "${win_arm64}")" \
            --arg mac_x64_url "$(asset_url "${mac_x64}")" \
            --arg mac_x64_sig "$(asset_signature "${mac_x64}")" \
            --arg mac_arm64_url "$(asset_url "${mac_arm64}")" \
            --arg mac_arm64_sig "$(asset_signature "${mac_arm64}")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_x64_sig, url: $win_x64_url },
                "windows-aarch64": { signature: $win_arm64_sig, url: $win_arm64_url },
                "darwin-x86_64": { signature: $mac_x64_sig, url: $mac_x64_url },
                "darwin-aarch64": { signature: $mac_arm64_sig, url: $mac_arm64_url }
              }
            }' > latest.json

          gh release upload "${TAG_NAME}" latest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Verify the public updater endpoint
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          expected="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"

          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 \
            "${expected}" --output published-latest.json
          advertised_version="$(jq -r '.version' published-latest.json)"
          if [[ "${advertised_version}" != "${version}" ]]; then
            echo "::error::Updater manifest advertises ${advertised_version}, expected ${version}."
            exit 1
          fi
          for target in windows-x86_64 windows-aarch64 darwin-x86_64 darwin-aarch64; do
            signature="$(jq -r --arg target "${target}" '.platforms[$target].signature // empty' published-latest.json)"
            url="$(jq -r --arg target "${target}" '.platforms[$target].url // empty' published-latest.json)"
            if [[ -z "${signature}" || -z "${url}" ]]; then
              echo "::error::Updater manifest is missing ${target}."
              exit 1
            fi
          done
          echo "Verified ${expected}"
